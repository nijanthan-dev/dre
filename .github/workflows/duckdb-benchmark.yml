name: DuckDB uncached comparison
on:
  push:
    branches: [bench/74-uncached-comparison]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {variant: baseline, sample: 1, sha: 8970f305d3ce5be284bdf69fc1c708ca279a18c1}
          - {variant: implementation, sample: 1, sha: f5c642c41fc944f4f9c451d579dca2346b37abde}
          - {variant: baseline, sample: 2, sha: 8970f305d3ce5be284bdf69fc1c708ca279a18c1}
          - {variant: implementation, sample: 2, sha: f5c642c41fc944f4f9c451d579dca2346b37abde}
          - {variant: baseline, sample: 3, sha: 8970f305d3ce5be284bdf69fc1c708ca279a18c1}
          - {variant: implementation, sample: 3, sha: f5c642c41fc944f4f9c451d579dca2346b37abde}
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      DRE_TEST_PREBUILT_BINS: '1'
      BENCH_VARIANT: ${{ matrix.variant }}
      BENCH_SAMPLE: ${{ matrix.sample }}
      BENCH_SHA: ${{ matrix.sha }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/dre-74-benchmark-target
      CARGO_HOME: ${{ runner.temp }}/dre-74-benchmark-cargo
      GOCACHE: ${{ runner.temp }}/dre-74-benchmark-go-cache
      GOMODCACHE: ${{ runner.temp }}/dre-74-benchmark-go-modules
      DRE_TEST_GO_PLUGINS: ${{ runner.temp }}/dre-74-benchmark-go-plugins
    steps:
      - uses: actions/checkout@v7
        with:
          path: benchmark-tools
      - uses: actions/checkout@v7
        with:
          repository: nijanthan-dev/dre
          ref: ${{ matrix.sha }}
          path: source
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Measure the unchanged CI command sequence
        working-directory: source
        run: python3 ../benchmark-tools/.github/scripts/duckdb_benchmark.py "$RUNNER_TEMP/dre-74-benchmark-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb-${{ matrix.variant }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/dre-74-benchmark-results
          if-no-files-found: error
  comparison:
    if: always()
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: duckdb-*
          path: results
      - run: python3 .github/scripts/duckdb_benchmark.py --compare results
