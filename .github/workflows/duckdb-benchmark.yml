name: DuckDB uncached comparison
on:
  push:
    branches: [bench/74-uncached-comparison]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sample: [1, 2, 3]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      DRE_TEST_PREBUILT_BINS: '1'
      BENCH_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: benchmark-tools
      - uses: actions/checkout@v7
        with:
          repository: nijanthan-dev/dre
          ref: 8970f305d3ce5be284bdf69fc1c708ca279a18c1
          path: baseline
      - uses: actions/checkout@v7
        with:
          repository: nijanthan-dev/dre
          ref: f5c642c41fc944f4f9c451d579dca2346b37abde
          path: implementation
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run hardware-matched pair with independent fresh caches
        run: |
          python3 - <<'PYPAIR'
          import os, subprocess
          from pathlib import Path
          variants = ['baseline', 'implementation'] if int(os.environ['BENCH_SAMPLE']) != 2 else ['implementation', 'baseline']
          commits = {'baseline': '8970f305d3ce5be284bdf69fc1c708ca279a18c1', 'implementation': 'f5c642c41fc944f4f9c451d579dca2346b37abde'}
          names = {'CARGO_TARGET_DIR': 'target', 'CARGO_HOME': 'cargo', 'GOCACHE': 'go-cache', 'GOMODCACHE': 'go-modules', 'DRE_TEST_GO_PLUGINS': 'go-plugins'}
          tool = Path('benchmark-tools/.github/scripts/duckdb_benchmark.py').resolve()
          status = 0
          for variant in variants:
              env = os.environ.copy()
              env.update({'BENCH_VARIANT': variant, 'BENCH_SHA': commits[variant]})
              for key, suffix in names.items():
                  env[key] = str(Path(env['RUNNER_TEMP']) / f'dre-74-{variant}-{suffix}')
              output = Path(env['RUNNER_TEMP']) / 'dre-74-benchmark-results' / variant
              status |= subprocess.run(['python3', str(tool), str(output)], cwd=variant, env=env).returncode
          raise SystemExit(status)
          PYPAIR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb-pair-${{ matrix.sample }}
          path: ${{ runner.temp }}/dre-74-benchmark-results
          if-no-files-found: error
  comparison:
    if: always()
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: duckdb-*
          path: results
      - run: python3 .github/scripts/duckdb_benchmark.py --compare results
